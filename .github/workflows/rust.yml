name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p kessler
      - run: cargo check -p kessler-wasm --target wasm32-unknown-unknown

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87
      - run: cargo check --workspace --all-targets

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install ./kesspy pytest
      - run: .venv/bin/pytest kesspy/tests

  c:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Sanitizers catch leaks and memory errors at the boundary; LeakSanitizer only runs on Linux.
      FLAGS: -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p kessler-c
      - run: cargo install cbindgen --locked --version 0.29.4
      - run: cbindgen --verify --config kessler-c/cbindgen.toml --output kessler-c/include/kessler.h kessler-c
      - run: cmake -S kessler-c/example -B build -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS"
      - run: cmake --build build
      - run: ./build/example && ./build/example_c
