# Adapted from `maturin generate-ci github` (maturin 1.16). kesspy builds abi3 wheels, so one wheel per platform
# covers every Python from 3.10 up.
name: kesspy-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { runner: ubuntu-latest, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, target: armv7, manylinux: auto }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: windows-latest, target: x64, test: true }
          - { runner: windows-11-arm, target: aarch64, test: true }
          - { runner: macos-15-intel, target: x86_64, test: true }
          - { runner: macos-latest, target: aarch64, test: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # Any version works: the abi3 wheel is tagged cp310 regardless
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --manifest-path kesspy/Cargo.toml
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist
      - uses: astral-sh/setup-uv@v10.3.3
        if: ${{ matrix.platform.test }}
      - name: pytest
        if: ${{ matrix.platform.test }}
        shell: bash
        run: |
          uv venv .venv
          source .venv/bin/activate 2>/dev/null || source .venv/Scripts/activate
          uv pip install kesspy --no-index --no-deps --find-links dist
          uv pip install numpy pytest
          pytest kesspy/tests

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path kesspy/Cargo.toml
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [wheels, sdist]
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - uses: actions/attest@v4
        with:
          subject-path: "wheels-*/*"
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv publish --trusted-publishing always 'wheels-*/*'
