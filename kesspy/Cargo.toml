[package]
name = "kesspy"
version.workspace = true
publish = false # Published to PyPI, not crates.io
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "kesspy"
crate-type = ["cdylib"]

[dependencies]
kessler.workspace = true
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py310"] }
rand = { workspace = true, features = ["sys_rng"] }
