[package]
name = "kesspy"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "kesspy"
crate-type = ["cdylib"]

[dependencies]
kessler = { path = ".." }
rand = "0.8.5"
numpy = "0.18.0"
pyo3 = { version = "0.18.1", features = ["extension-module"] }
