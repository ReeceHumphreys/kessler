[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "kesspy"
dynamic = ["version"]
description = "An implementation of the NASA Standard Breakup Model in Python"
readme = "README.md"
license = "MIT"
authors = [{ name = "Reece Humphreys", email = "reecewh@icloud.com" }]
requires-python = ">=3.10"
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/ReeceHumphreys/kessler"
Issues = "https://github.com/ReeceHumphreys/kessler/issues"
Documentation = "https://kesspy.readthedocs.io/en/latest/"

[dependency-groups]
dev = ["maturin>=1.16,<2", "pytest"]
