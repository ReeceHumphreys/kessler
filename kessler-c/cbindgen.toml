language = "C"
include_guard = "KESSLER_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from kessler-c/src/lib.rs; do not edit. */"
usize_is_size_t = true
trailer = """
#ifdef __cplusplus
#include <utility>

namespace kessler {
/** Owns KesslerFragments and frees them when it goes out of scope. */
class Fragments {
  public:
    Fragments() = default;
    Fragments(const Fragments&) = delete;
    Fragments& operator=(const Fragments&) = delete;
    Fragments(Fragments&& o) noexcept : f_(std::exchange(o.f_, KesslerFragments{})) {}
    Fragments& operator=(Fragments&& o) noexcept {
        std::swap(f_, o.f_);
        return *this;
    }
    ~Fragments() { kessler_fragments_free(&f_); }

    /** Pass to kessler_explosion or kessler_collision. */
    KesslerFragments* out() {
        kessler_fragments_free(&f_);
        return &f_;
    }
    const KesslerFragments& operator*() const { return f_; }
    const KesslerFragments* operator->() const { return &f_; }

  private:
    KesslerFragments f_{};
};
}  // namespace kessler
#endif
"""

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
