[package]
name = "kessler"
version = "0.2.0"
description = "Kessler is a library for simulating fragmentation events in low Earth orbit."
keywords = ["kessler", "space", "simulation", "fragmentation"]
categories = ["science", "simulation"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rand.workspace = true
rand_distr = "0.6.0"

[dev-dependencies]
rand = { workspace = true, features = ["std_rng"] }

[workspace]
members = ["kesspy", "kessler-wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Reece Humphreys"]
repository = "https://github.com/ReeceHumphreys/kessler"

[workspace.dependencies]
kessler = { path = "." }
rand = { version = "0.10.4", default-features = false }

[profile.release]
strip = "debuginfo" # Keeps the custom sections wasm-bindgen reads
lto = true
codegen-units = 1
