[package]
name = "kessler-wasm"
version = "0.1.4"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for Kessler, a library for simulating fragmentation events in low Earth orbit."
repository = "https://github.com/reecehumphreys/kessler/"

[lib]
crate-type = ["cdylib"]

[dependencies]
kessler = { path = ".." }
rand = "0.8.5"
wasm-bindgen = "0.2.90"
# Lets rand seed from the browser's crypto API.
getrandom = { version = "0.2", features = ["js"] }
